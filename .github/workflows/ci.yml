name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      # The same order as subtitledb-cdn: each step fails on the cheapest signal
      # available, so a formatting slip never costs a deploy dry run.
      - name: Lint
        run: ./node_modules/.bin/biome ci --error-on-warnings .

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # What wrangler will actually build and upload, without uploading it.
      - name: Build
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  # The vendored copies of the converter, the similarity function and the shared match
  # cases, against subtitledb-cdn@main. A failure is not "update the copy": it is
  # "somebody changed a rule, decide whether this addon changes with it".
  # Skipped on a fork's pull request: GitHub withholds secrets from those, so
  # UPSTREAM_TOKEN would be empty and check-upstream.mjs would exit 2 for a reason
  # that has nothing to do with the change. Still runs on every push to main.
  upstream:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: No drift from subtitledb-cdn
        run: node tools/check-upstream.mjs
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}

  # Kept separate, but blocking. These call api.thesubtitledb.org directly, so a
  # failure here means the API changed or is down, not that this repo regressed, and
  # that difference is worth being able to read off the job list. It is still a
  # failure: nothing else proves the addon and the API agree.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm ci

      - name: Live API contract tests
        run: npm run test:live
